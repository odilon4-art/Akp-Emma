function parseCoords(t){t=String(t||'');try{t=decodeURIComponent(t)}catch(e){}
if(/(goo\.gl|maps\.app)/i.test(t)&&!/\d+\.\d+/.test(t))return{err:"Ce lien court ne contient pas les coordonnées. Ouvrez-le dans Google Maps, puis copiez les deux nombres de la barre d'adresse (ou faites un appui long sur le lieu)."};

if(!m){const u=t.trim().replace(/^\(|\)$/g,'');const n=/^-?\d+,\d+\s+-?\d+,\d+$/.test(u)?u.replace(/,/g,'.'):u;m=n.match(/(-?\d{1,3}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)/)}
if(!m)return{err:'Je ne trouve pas deux nombres. Exemple : 6.1319, 1.2228'};
return{la:+m[1],lo:+m[2]}}

async function showMap(){const a=num(v('la')),b=num(v('lo'));if(isNaN(a)||isNaN(b))return;const r=await fetch(U+'/api/carte',{method:'POST',headers:{'X-OM':'1','Content-Type':'application/json'},body:JSON.stringify({lat:a,lng:b})}).catch(()=>null);toast(r&&r.ok?'Carte ouverte dans votre navigateur (Internet nécessaire).':'Impossible d’ouvrir la carte')}
const gpsBlock=(a,b)=>`<div class="loc"><h3>Position GPS <span class="req">obligatoire</span></h3><label>Coller les coordonnées ou le lien Google Maps<input id="gp" placeholder="Ex. 6.1319, 1.2228" autocomplete="off" oninput="clearTimeout(gpsPaste.t);gpsPaste.t=setTimeout(gpsPaste,350)" onpaste="setTimeout(gpsPaste,0)"></label><div class="row"><label>Latitude<input id="la" inputmode="decimal" value="${a??''}" oninput="locStat()" onchange="this.value=this.value.replace(',','.')"></label><label>Longitude<input id="lo" inputmode="decimal" value="${b??''}" oninput="locStat()" onchange="this.value=this.value.replace(',','.')"></label></div><div id="lst" class="locst" role="status"></div><button class="b g" id="vmap" onclick="showMap()" disabled>Vérifier sur la carte</button><button class="b g" onclick="geoFill()">📍 Ma position actuelle</button><small>Dans Google Maps, faites un appui long sur le lieu : les deux nombres apparaissent, copiez-les et collez-les dans le premier champ. « Ma position actuelle » est fiable sur un téléphone, sur place ; sur un ordinateur, la précision est souvent mauvaise.</small></div>`;

const VIEWS={acc:()=>accV(),inf:()=>infV(),med:()=>medV(),arc:()=>arcV(),res:()=>resV(),fiche:()=>ficheV(),per:()=>perV(),cpt:()=>cptV()};
async function load(){const h=await sb.from('hopitaux').select('*').eq('id',ME.hopital_id).maybeSingle();HOP=h.data;if(ME.simulateur){const sl=await sb.rpc('simulation_liste');SIML=sl.data||[]}if(ME.role=='admin')await loadStaff();await refresh(true);
if(!chn){chn=sb.channel('h').on('postgres_changes',{event:'*',schema:'public',table:'rendez_vous',filter:'hopital_id=eq.'+ME.hopital_id},()=>{if(!typing())refresh()}).subscribe()}}
async function refresh(force){if(!ME||!HOP)return;const{data}=await sb.from('rendez_vous').select('*,patients(nom,prenom,age,sexe,telephone,code_carnet,date_naissance),constantes(*),ordonnances(*,ordonnance_lignes(*))').eq('hopital_id',HOP.id).order('created_at',{ascending:false}).limit(300);RDV=data||[];const rs=await sb.from('resultats_analyses').select('*,patients(nom,prenom,code_carnet)').eq('hopital_id',HOP.id).order('created_at',{ascending:false}).limit(100);RES=rs.data||[];if(force||!typing())render()}
const day=r=>new Date(r.created_at).toLocaleDateString('fr-FR');
const WARN_IC='<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18.5v.01"/></svg>';
const pat=r=>{const p=r.patients||{},paid=r.paiement_statut=='paye';return`<div class="tk${r.urgence?' urg':''}"><div class="tk-n"><small>N°</small><b>${r.numero_file}</b></div><div class="tk-b">${r.urgence?`<div><span class="flag">${WARN_IC}Urgence : ${esc(r.urgence)}</span></div>`:''}<div class="tk-name">${esc(p.prenom||'')} ${esc(p.nom||'')} <span class="tg">${p.age??'?'} ans · ${esc(p.sexe||'')}</span></div><div class="tk-m">Tél. ${esc(p.telephone||'—')} · Carnet ${esc(p.code_carnet||'')} · ${day(r)}</div><div class="tk-s">Symptômes : ${esc(r.symptomes||'—')} → <b>${esc(r.specialite)}</b></div><div class="tk-t">${r.numero_assure?`<span class="tg">${esc(r.assurance)} : ${money(r.part_assurance)} pris en charge</span><small>Assuré n° ${esc(r.numero_assure)}${r.assure_principal?' · principal : '+esc(r.assure_principal):''}${p.date_naissance?' · né(e) le '+new Date(p.date_naissance).toLocaleDateString('fr-FR'):''}</small>`:''}${r.mode_paiement=='Espèces'?`<span class="tg">${paid?'Payé en espèces':'Paiement en espèces'}</span>`:paid?`<span class="tg">Payé : ${esc(r.mode_paiement||'en ligne')}</span>`:''}</div></div></div>`};
const vits=c=>`<div class="vits"><span><i>Température</i><b>${c.temperature??'—'} °C</b></span><span><i>Tension</i><b>${esc(c.tension||'—')}</b></span><span><i>Poids</i><b>${c.poids??'—'} kg</b></span></div>`;
const open=(st)=>RDV.filter(r=>r.statut==st&&r.paiement_statut=='paye').sort((a,b)=>(!!b.urgence-!!a.urgence)||new Date(a.paye_le||a.created_at)-new Date(b.paye_le||b.created_at)||a.numero_file-b.numero_file);
async function savePay(){if(busy)return;const sel=[...document.querySelectorAll('.pay:checked')].map(x=>x.value);if(!sel.length)return toast('Choisissez au moins un mode de paiement');busy=true;const{error}=await sb.from('hopitaux').update({paiements_acceptes:sel}).eq('id',HOP.id);busy=false;if(error)return toast(error.message&&error.message.includes('incompl')?'Fiche incomplète : complétez l’onglet Fiche d’abord':'Enregistrement impossible');HOP.paiements_acceptes=sel;toast('Modes de paiement enregistrés');render()}
const payStats=()=>{const m={};RDV.filter(r=>r.paiement_statut=='paye').forEach(r=>{const k=r.mode_paiement||'Espèces';m[k]=m[k]||{n:0,t:0};m[k].n++;m[k].t+=Number(r.montant)||0});return Object.entries(m).sort((a,b)=>b[1].t-a[1].t)};
function accV(){const L=RDV.filter(r=>r.statut=='attente'&&r.paiement_statut=='en_attente'&&r.mode_paiement=='Espèces').sort((a,b)=>(!!b.urgence-!!a.urgence)),acc=(HOP&&HOP.paiements_acceptes)||PAYS,ST=payStats();return`<h2>Mode de paiement</h2><div class="c"><b>Modes acceptés par votre établissement</b>${ME.role=='admin'?`${payBlock(acc)}<button class="b" onclick="savePay()">Enregistrer les modes</button><br><small>Cochez les modes que votre établissement accepte, puis enregistrez.</small>`:`<div>${acc.map(p=>`<span class="tg">${esc(p)}</span>`).join('')}</div><small>Seul l'administrateur peut modifier ces modes.</small>`}</div><h2>À encaisser en espèces (${L.length})</h2><p>Vérifiez l'identité et l'assurance du patient, encaissez, puis cliquez : il entre dans la file d'attente.</p><div class="grid">`+(L.map(r=>`<div class="c">${pat(r)}<br><b>À encaisser : ${money(r.montant)}</b><br><button class="b" onclick="enc(${r.id})">Encaissé ✔</button></div>`).join('')||empty('Aucun paiement en espèces en attente.'))+`</div><h2>Paiements reçus par mode</h2><div class="grid">`+(ST.map(([k,x])=>`<div class="c"><b>${esc(k)}</b><div class="big">${money(x.t)}</div><small>${x.n} paiement${x.n>1?'s':''}</small></div>`).join('')||empty('Aucun paiement enregistré pour le moment.'))+`</div>`}
async function enc(id){if(busy)return;busy=true;const{error}=await sb.rpc('encaisser_rdv_especes',{p_rdv:id});busy=false;if(error)return toast('Encaissement impossible');toast('Encaissé : le patient est dans la file');refresh(true)}
function infV(){const L=open('attente');return`<h2>Patients à l'infirmerie (${L.length})</h2><p>Saisissez les constantes, puis envoyez le dossier au médecin.</p><div class="grid">`+(L.map(r=>`<div class="c">${pat(r)}<br><small class="mu">Ce dossier sera envoyé au médecin : <b>${esc(r.specialite)}</b></small><div class="row"><input id="t${r.id}" inputmode="decimal" placeholder="Temp. °C"><input id="ta${r.id}" placeholder="Tension 12/8"><input id="po${r.id}" inputmode="decimal" placeholder="Poids kg"></div><button class="b" onclick="vit(${r.id})">Envoyer au médecin</button></div>`).join('')||empty('Aucun patient en attente.'))+`</div>`}
async function vit(id){if(busy)return;const t=parseFloat(v('t'+id).replace(',','.')),po=parseFloat(v('po'+id).replace(',','.')),ta=v('ta'+id).trim();if(!(t>30&&t<45)||!ta||!(po>0&&po<400))return toast('Vérifiez la température, la tension et le poids');busy=true;
const md=await sb.rpc('medecin_disponible',{p_rdv:id});if(!md.error&&md.data===false){busy=false;return toast('Aucun médecin enregistré pour cette spécialité dans votre établissement : créez-le dans « Personnel »')}
const a=await sb.from('constantes').insert({rendez_vous_id:id,temperature:t,tension:ta,poids:po,saisi_par:ME.id});if(a.error){busy=false;return toast('Enregistrement impossible : '+(a.error.message||'erreur inconnue'))}
const b=await sb.from('rendez_vous').update({statut:'constantes'}).eq('id',id);busy=false;if(b.error)return toast('Mise à jour impossible : '+(b.error.message||'erreur inconnue'));toast('Dossier envoyé au médecin');refresh(true)}
const row=()=>`<div class="row l"><input class="mn" placeholder="Médicament (ex. Paracétamol 500mg)"><input class="ps" placeholder="Posologie (ex. 1 comprimé 3 fois par jour pendant 5 jours)"></div>`;
function medV(){let L=open('constantes');
return`<h2>Patients à consulter (${L.length})</h2>`+`<p>Vous recevez ici uniquement les dossiers de votre spécialité (${esc((ME.specialites||[]).join(', ')||'toutes')}), envoyés par l'infirmerie.</p>`+`<div class="grid">`+(L.map(r=>{const c=r.constantes||{};return`<div class="c">${pat(r)}${vits(c)}`+(openR==r.id?`<h2>Ordonnance</h2><div id="ln${r.id}">${row()}</div><button class="b g" onclick="$('ln${r.id}').insertAdjacentHTML('beforeend',row())">+ Médicament</button><textarea id="cn${r.id}" rows="3" placeholder="Consignes pour le patient (repos, alimentation, prochain rendez-vous…)"></textarea><input id="sg${r.id}" placeholder="Signature électronique" value="Dr ${esc(ME.prenom||'')} ${esc(ME.nom||'')}"><div class="stamp">${esc(HOP.nom)}<br>CACHET</div><br><button class="b" onclick="sendOrd(${r.id})">Envoyer au patient et archiver</button><button class="b g" onclick="openR=null;render()">Annuler</button>`:`<button class="b" onclick="openR=${r.id};render()">Rédiger l'ordonnance</button>`)+`</div>`}).join('')||empty('Aucun patient avec constantes pour le moment.'))+`</div>`}
function resV(){const can=ME.role=='medecin'||(ME.role=='admin'&&ME.simulateur);const fd=d=>new Date(d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});return`<h2>Publier des résultats d'analyses</h2><div class="c"><p>Le patient les verra dans son application Ordonnance Mobile P, uniquement avec son propre compte.</p><input id="rc" placeholder="Code de carnet du patient"><input id="rt" placeholder="Titre (ex. Bilan sanguin, Selles, Urines)"><textarea id="rx" rows="6" placeholder="Résultats (valeurs, unités, conclusion…)"></textarea><button class="b" onclick="pubRes()">Publier au patient</button></div><h2>Résultats publiés (${RES.length})</h2>`+(RES.map(x=>{const p=x.patients||{};return`<div class="c"><b>${esc(x.titre)}</b> · ${esc(p.prenom||'')} ${esc(p.nom||'')} <small>Carnet ${esc(p.code_carnet||'')} · ${fd(x.created_at)}</small><br>${x.repondu_le?'<span class="tg ok">Réponse envoyée</span>':x.soumis_le?'<span class="tg" style="border-color:var(--er)">À traiter : le patient a soumis ses résultats</span>':'<span class="tg">Publié · pas encore soumis par le patient</span>'}<div style="white-space:pre-wrap;margin-top:6px">${esc(x.contenu)}</div>`+(can&&x.soumis_le&&!x.repondu_le?(openR=='r'+x.id?`<h2>Réponse du médecin</h2><textarea id="rn${x.id}" rows="3" placeholder="Réponse ou consignes pour le patient"></textarea><div id="ln${x.id}">${row()}</div><button class="b g" onclick="$('ln${x.id}').insertAdjacentHTML('beforeend',row())">+ Médicament</button><input id="sg${x.id}" value="Dr ${esc(ME.prenom||'')} ${esc(ME.nom||'')}"><br><button class="b" onclick="repRes(${x.id})">Envoyer au patient</button><button class="b g" onclick="openR=null;render()">Annuler</button>`:`<button class="b" onclick="openR='r${x.id}';render()">Répondre / prescrire</button>`):'')+(x.reponse_note?`<br><small>Réponse : ${esc(x.reponse_note)}</small>`:'')+`</div>`}).join('')||empty('Aucun résultat publié.'))+`<button class="b g" onclick="refresh(true)">Actualiser</button>`}
async function pubRes(){if(busy)return;const c=v('rc').trim(),t=v('rt').trim(),x=v('rx').trim();if(!c||t.length<2||x.length<2)return toast('Code de carnet, titre et résultats requis');busy=true;const{error}=await sb.rpc('publier_resultat',{p_code:c,p_titre:t,p_contenu:x});busy=false;if(error)return toast('Publication impossible : '+error.message);toast('Résultats publiés : le patient peut les consulter');await refresh(true)}

async function saveFiche(mode){if(busy)return;const T=asRead(),sp=[...new Set([...[...document.querySelectorAll('.sp:checked')].map(x=>x.value),...lst(v('fo'))])];
if(mode===false&&!$('fc').checked)return toast('Cochez la case de certification');
if(v('la')!==''&&v('lo')!==''&&(+v('la')<6||+v('la')>11.2||+v('lo')<-0.3||+v('lo')>1.9)&&!confirm('Cette position semble être hors du Togo (latitude entre 6 et 11, longitude entre 0 et 2 attendues). La garder quand même ?'))return;
const photo=v('fi').trim();if(photo&&!/^https:\/\/[^\s]+$/i.test(photo))return toast('La photo doit utiliser une adresse HTTPS publique');const o={nom:v('fn').trim(),image_url:photo||null,type_etablissement:v('ft'),localisation:v('fl').trim(),repere:v('fr').trim(),lat:v('la')===''?null:+v('la'),lng:v('lo')===''?null:+v('lo'),telephone:v('ft2').trim(),email:v('fe').trim(),responsable:v('fs').trim(),agrement:v('fa').trim(),...readHours(),urgences_24h:$('hu').checked,specialites:sp,prix_consultation:Math.max(0,Math.round(+v('fp'))),paiements_acceptes:readPay(),assurances:Object.keys(T),taux_assurances:T};
if(mode===false)o.publie=true;busy=true;const{error}=await sb.from('hopitaux').update(o).eq('id',HOP.id);busy=false;
if(error)return toast(error.message.includes('incompl')?'Fiche incomplète : nom, adresse, position GPS, prix et au moins une spécialité sont obligatoires':'Enregistrement impossible');
HOP={...HOP,...o};toast(mode===false?'Fiche publiée : les patients vous voient':'Fiche enregistrée');render()}
