async function signupPharmacy(){if(busy)return;const nom=v('pn').trim(),responsable=v('pr').trim(),email=v('pe').trim().toLowerCase(),password=v('ppw');if(nom.length<2||responsable.length<2||!email||password.length<8)return toast('Remplissez les champs et choisissez un mot de passe de 8 caractères minimum');busy=true;try{const r=await fetch(U+'/functions/v1/inscription-etablissement',{method:'POST',headers:{'Content-Type':'application/json','X-OM':'1',apikey:K},body:JSON.stringify({type:'pharmacie',nom,responsable,email,password})});let j={};try{j=await r.json()}catch(e){}if(!r.ok||!j.ok){busy=false;return toast(j.error||'Création du compte impossible')}const a=await sb.auth.signInWithPassword({email,password});busy=false;if(a.error){authMode='login';render();return toast('Compte créé. Connectez-vous avec votre e-mail et votre mot de passe.')}authMode='login';await boot();tab='fiche';render();toast('Compte créé. Complétez la fiche et soumettez-la à Admin.')}catch(e){busy=false;toast('Connexion internet impossible. Réessayez.')}}

const TG=(a,b)=>a>=6&&a<=11.2&&b>=-0.3&&b<=1.9,num=t=>{t=String(t||'').trim().replace(',','.');return t===''?NaN:Number(t)};
function parseCoords(t){t=String(t||'');try{t=decodeURIComponent(t)}catch(e){}
if(/(goo\.gl|maps\.app)/i.test(t)&&!/\d+\.\d+/.test(t))return{err:"Ce lien court ne contient pas les coordonnées. Ouvrez-le dans Google Maps, puis copiez les deux nombres de la barre d'adresse (ou faites un appui long sur le lieu)."};
let m=t.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/)||t.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/)||t.match(/[?&](?:q|ll|query|mlat)=(-?\d+(?:\.\d+)?)[,&]\s*(?:mlon=)?(-?\d+(?:\.\d+)?)/);
if(!m){const u=t.trim().replace(/^\(|\)$/g,'');const n=/^-?\d+,\d+\s+-?\d+,\d+$/.test(u)?u.replace(/,/g,'.'):u;m=n.match(/(-?\d{1,3}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)/)}
if(!m)return{err:'Je ne trouve pas deux nombres. Exemple : 6.1319, 1.2228'};
return{la:+m[1],lo:+m[2]}}
function gpsPaste(){const r=parseCoords(v('gp'));if(!v('gp').trim())return;if(r.err){$('lst').className='locst bad';$('lst').textContent='⚠ '+r.err;return}
$('la').value=String(r.la);$('lo').value=String(r.lo);$('gp').value='';locStat()}
function locStat(){const e=$('lst');if(!e)return;const a=num(v('la')),b=num(v('lo')),vb=$('vmap');if(vb)vb.disabled=true;
if(v('la').trim()===''&&v('lo').trim()===''){e.className='locst';e.textContent='Position non renseignée (obligatoire pour publier la fiche).';return}
if(isNaN(a)||isNaN(b)){e.className='locst bad';e.textContent='⚠ Latitude et longitude doivent être des nombres (exemple : 6.1319 et 1.2228).';return}
if(!TG(a,b)){e.className='locst bad';e.textContent='⚠ Cette position est hors du Togo. Vérifiez l’ordre : latitude d’abord (entre 6 et 11), puis longitude (entre 0 et 2).';if(vb)vb.disabled=false;return}
e.className='locst ok';e.textContent='✔ Position valide, au Togo ('+a.toFixed(5)+', '+b.toFixed(5)+').';if(vb)vb.disabled=false}
async function showMap(){const a=num(v('la')),b=num(v('lo'));if(isNaN(a)||isNaN(b))return;const r=await fetch(U+'/api/carte',{method:'POST',headers:{'X-OM':'1','Content-Type':'application/json'},body:JSON.stringify({lat:a,lng:b})}).catch(()=>null);toast(r&&r.ok?'Carte ouverte dans votre navigateur (Internet nécessaire).':'Impossible d’ouvrir la carte')}
const gpsBlock=(a,b)=>`<div class="loc"><h3>Position GPS <span class="req">obligatoire</span></h3><label>Coller les coordonnées ou le lien Google Maps<input id="gp" placeholder="Ex. 6.1319, 1.2228" autocomplete="off" oninput="clearTimeout(gpsPaste.t);gpsPaste.t=setTimeout(gpsPaste,350)" onpaste="setTimeout(gpsPaste,0)"></label><div class="row"><label>Latitude<input id="la" inputmode="decimal" value="${a??''}" oninput="locStat()" onchange="this.value=this.value.replace(',','.')"></label><label>Longitude<input id="lo" inputmode="decimal" value="${b??''}" oninput="locStat()" onchange="this.value=this.value.replace(',','.')"></label></div><div id="lst" class="locst" role="status"></div><button class="b g" id="vmap" onclick="showMap()" disabled>Vérifier sur la carte</button><button class="b g" onclick="geoFill()">📍 Ma position actuelle</button><small>Dans Google Maps, faites un appui long sur le lieu : les deux nombres apparaissent, copiez-les et collez-les dans le premier champ. « Ma position actuelle » est fiable sur un téléphone, sur place ; sur un ordinateur, la précision est souvent mauvaise.</small></div>`;
const geoErr=e=>toast(!window.isSecureContext?"Ouvrez l'application depuis son adresse https (pas depuis un fichier du téléphone)":e&&e.code==1?'Position refusée : autorisez la position pour ce site dans Chrome (cadenas), puis dans les réglages du téléphone':e&&e.code==2?'Position introuvable : activez le GPS':'Délai dépassé : réessayez avec le GPS activé'),GEO={enableHighAccuracy:true,timeout:15000,maximumAge:60000};
function geoFill(){if(!navigator.geolocation)return toast('Localisation indisponible : collez les coordonnées à la place');toast('Recherche de la position…');navigator.geolocation.getCurrentPosition(p=>{$('la').value=p.coords.latitude.toFixed(6);$('lo').value=p.coords.longitude.toFixed(6);locStat();const m=Math.round(p.coords.accuracy||0);toast(m>150?'Position remplie, mais peu précise (±'+(m>=1000?(m/1000).toFixed(1)+' km':m+' m')+'). Collez plutôt les coordonnées de Google Maps.':'Position remplie (±'+m+' m) : vérifiez-la')},e=>{geoErr(e);toast('Position indisponible : collez les coordonnées de Google Maps à la place')},GEO)}

async function load(){const p=await sb.from('pharmacies').select('*').eq('id',ME.pharmacie_id).maybeSingle();PHM=p.data;await loadStaff();await refresh(true);
if(!chn){const f='pharmacie_id=eq.'+ME.pharmacie_id,cb=()=>{if(!typing())refresh()};chn=sb.channel('ph').on('postgres_changes',{event:'*',schema:'public',table:'produits_pharmacie',filter:f},cb).on('postgres_changes',{event:'*',schema:'public',table:'commandes_pharmacie',filter:f},cb).subscribe()}}
async function refresh(force){if(!ME||!PHM)return;const[a,b,c]=await Promise.all([sb.from('produits_pharmacie').select('*').eq('pharmacie_id',PHM.id).order('nom'),sb.from('commandes_pharmacie').select('id,produit,quantite,montant,part_assurance,assurance,mode_paiement,statut,created_at,livre_le,numero_assure,assure_principal,assure_nom,assure_naissance,assure_sexe,code_prescripteur,code_formation,assurance2,numero_assure2,part_assurance2').eq('pharmacie_id',PHM.id).order('id',{ascending:false}).limit(100),sb.from('ventes_comptoir').select('*').eq('pharmacie_id',PHM.id).order('id',{ascending:false}).limit(30)]);STK=a.data||[];CM=b.data||[];VT=c.data||[];if(force||!typing())render()}
const hr=d=>new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const asCh=(sel,cls)=>((PHM&&PHM.assurances)||[]).map(a=>`<label class="tg"><input type="checkbox" class="${cls}" value="${esc(a)}" ${sel.includes(a)?'checked':''} style="width:auto"> ${esc(a)}</label>`).join('')||'<small>Aucune assurance configurée (voir Paramètres)</small>';
function stkV(){const low=STK.filter(p=>p.quantite<=5).length;return`<div class="c"><h2 style="margin-top:0">Ajouter un produit</h2><div class="row"><input id="nn" placeholder="Nom (ex. Paracétamol 500mg)"><input id="nq" type="number" min="0" placeholder="Quantité en stock"><input id="np" type="number" min="0" placeholder="Prix (FCFA)"></div><label><input type="checkbox" id="nr" checked style="width:auto"> Remboursable par les assurances</label><div>${asCh([],'nac')}</div><small>Cochez des assurances pour limiter la prise en charge à celles-ci. Aucune case cochée : toutes les assurances de la pharmacie.</small><br><button class="b" onclick="addP()">Ajouter</button></div>
<h2>Stock (${STK.length} produits${low?` · <span class="ok" style="color:var(--er)">${low} bientôt épuisé(s)</span>`:''})</h2><div class="tw"><table><tr><th>Produit</th><th>En stock</th><th>Prix (FCFA)</th><th>Assurances</th><th></th></tr>${STK.map(p=>`<tr class="${p.quantite<=5?'lowr':''}"><td><b>${esc(p.nom)}</b></td><td><input id="q${p.id}" type="number" min="0" value="${p.quantite}" class="${p.quantite<=5?'low':''}"></td><td><input id="p${p.id}" type="number" min="0" value="${p.prix}"></td><td><details><summary>${p.remboursable?(p.assurances_prises.length?esc(p.assurances_prises.join(', ')):'Toutes'):'Non remboursé'}</summary><label><input type="checkbox" id="r${p.id}" ${p.remboursable?'checked':''} style="width:auto"> Remboursable</label><div>${asCh(p.assurances_prises,'ac'+p.id)}</div></details></td><td><button class="b" onclick="savP(${p.id})">Enregistrer</button><button class="b g" onclick="delP(${p.id})">Supprimer</button></td></tr>`).join('')}</table></div>`}
async function addP(){const n=v('nn').trim(),q=Math.round(+v('nq')),p=Math.round(+v('np'));if(!n||!(q>=0)||!(p>=0)||v('nq')===''||v('np')==='')return toast('Nom, quantité et prix requis');
const{error}=await sb.from('produits_pharmacie').insert({pharmacie_id:PHM.id,nom:n,quantite:q,prix:p,remboursable:$('nr').checked,assurances_prises:[...document.querySelectorAll('.nac:checked')].map(x=>x.value)});if(error)return toast(error.code=='23505'?'Ce produit existe déjà':'Ajout impossible');toast('Produit ajouté');refresh(true)}
async function savP(id){const q=Math.round(+v('q'+id)),p=Math.round(+v('p'+id));if(!(q>=0)||!(p>=0))return toast('Quantité ou prix invalide');
const{error}=await sb.from('produits_pharmacie').update({quantite:q,prix:p,remboursable:$('r'+id).checked,assurances_prises:[...document.querySelectorAll('.ac'+id+':checked')].map(x=>x.value),updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast('Enregistrement impossible');toast('Produit enregistré');refresh(true)}
async function delP(id){if(!confirm('Supprimer ce produit du stock ?'))return;const{error}=await sb.from('produits_pharmacie').delete().eq('id',id);if(error)return toast('Suppression impossible');refresh(true)}
function cmdV(){const e=CM.filter(c=>c.statut=='en_attente_paiement'&&c.mode_paiement=='Espèces'),a=CM.filter(c=>c.statut=='paye'),b=CM.filter(c=>c.statut=='livre').slice(0,20),cd=c=>`<div class="c"><div class="tk"><div class="tk-n ${c.statut=='livre'?'done':''}"><small>Qté</small><b>${c.quantite}</b></div><div class="tk-b"><span class="tk-name">${esc(c.produit)}</span> <span class="tg">${esc(c.mode_paiement)}</span><br><small>${hr(c.created_at)} · payé ${money(c.montant)}${c.part_assurance?` · ${esc(c.assurance)} ${money(c.part_assurance)}`:''}</small>${c.numero_assure?`<br><small>Assuré n° ${esc(c.numero_assure)}${c.assure_principal?' · '+esc(c.assure_principal):''}</small>`:''}${c.assurance2?`<br><small>Complémentaire : ${esc(c.assurance2)} n° ${esc(c.numero_assure2||'')} (${money(c.part_assurance2)})</small>`:''}${c.code_prescripteur?`<br><small>Dossier assurance : ${esc(c.assure_nom||'')} · né(e) le ${esc(c.assure_naissance||'')} · ${esc(c.assure_sexe||'')} · prescripteur ${esc(c.code_prescripteur)} · formation sanitaire ${esc(c.code_formation||'')}</small>`:''}</div></div></div>`;
return`<div class="c"><h2 style="margin-top:0">Valider une remise de produit</h2><p>Demandez au client son code de retrait à 6 chiffres. Pour une réservation en espèces, validez après avoir encaissé.</p><div class="row"><input id="cd" inputmode="numeric" maxlength="6" placeholder="Code de retrait" onkeydown="if(event.key=='Enter')deliv()"><button class="b" onclick="deliv()" style="flex:0 0 auto">Valider la remise</button></div></div><h2>Réservations à payer en espèces (${e.length})</h2><p>Encaissez le client, puis validez son code : le stock baisse à ce moment.</p><div class="grid">${e.map(c=>`<div class="c"><div class="tk"><div class="tk-n"><small>Qté</small><b>${c.quantite}</b></div><div class="tk-b"><span class="tk-name">${esc(c.produit)}</span> <span class="tg">Espèces</span><br><small>${hr(c.created_at)} · à encaisser <b>${money(c.montant)}</b>${c.part_assurance?` (${esc(c.assurance)} ${money(c.part_assurance)})`:''}</small>${c.numero_assure?`<br><small>Assuré n° ${esc(c.numero_assure)}${c.assure_principal?' · '+esc(c.assure_principal):''}</small>`:''}${c.code_prescripteur?`<br><small>Dossier assurance : ${esc(c.assure_nom||'')} · né(e) le ${esc(c.assure_naissance||'')} · ${esc(c.assure_sexe||'')} · prescripteur ${esc(c.code_prescripteur)} · formation sanitaire ${esc(c.code_formation||'')}</small>`:''}</div></div></div>`).join('')||empty('Aucune réservation en espèces.')}</div><h2>Payées en ligne, à remettre (${a.length})</h2><p>Le stock a déjà été retiré au moment du paiement.</p><div class="grid">${a.map(cd).join('')||empty('Aucune commande en attente de remise.')}</div><h2>Déjà remises</h2><div class="grid">${b.map(c=>cd(c).replace('· payé',`· remis ${hr(c.livre_le)} · payé`)).join('')||empty('Rien pour le moment.')}</div>`}
async function deliv(){if(busy)return;const c=v('cd').trim();if(!/^\d{6}$/.test(c))return toast('Le code a 6 chiffres');busy=true;const{error}=await sb.rpc('delivrer_commande',{p_pharmacie:PHM.id,p_code:c});busy=false;if(error)return toast(error.message.includes('stock')?'Stock insuffisant':'Code invalide ou déjà utilisé');toast('Remise validée ✔');refresh(true)}
async function savePay(){if(busy)return;const sel=[...document.querySelectorAll('.pay:checked')].map(x=>x.value);if(!sel.length)return toast('Choisissez au moins un mode de paiement');busy=true;const{error}=await sb.from('pharmacies').update({paiements_acceptes:sel}).eq('id',PHM.id);busy=false;if(error)return toast(error.message&&error.message.includes('incompl')?'Fiche incomplète : complétez l’onglet Fiche d’abord':'Enregistrement impossible');PHM.paiements_acceptes=sel;toast('Modes de paiement enregistrés');render()}
function vteV(){const L=STK.filter(p=>p.quantite>0),M=(PHM&&PHM.paiements_acceptes&&PHM.paiements_acceptes.length)?PHM.paiements_acceptes:PAYS,mm={};VT.forEach(x=>{const k=x.mode_paiement||'Espèces';mm[k]=(mm[k]||0)+Number(x.montant||0)});return`<h2>Mode de paiement</h2><div class="c"><b>Modes acceptés par votre pharmacie</b>${payBlock(M)}<button class="b" onclick="savePay()">Enregistrer les modes</button><br><small>Cochez les modes que votre pharmacie accepte, puis enregistrez.</small></div><div class="c"><h2 style="margin-top:0">Vente au comptoir</h2><p>Quand un client paie au comptoir, choisissez son mode de paiement et enregistrez la vente : le stock baisse tout de suite.</p>`+(L.length?`<select id="vp" onchange="vtot()">${L.map(p=>`<option value="${esc(p.nom)}" data-p="${p.prix}" data-q="${p.quantite}">${esc(p.nom)} · ${p.quantite} en stock · ${money(p.prix)}</option>`).join('')}</select><div class="row"><label>Quantité<input id="vq" type="number" min="1" value="1" oninput="vtot()"></label><label>Mode de paiement<select id="vm">${M.map(p=>`<option>${esc(p)}</option>`).join('')}</select></label></div><div id="vt" class="big"></div><button class="b" onclick="vend()">Enregistrer la vente</button>`:empty('Aucun produit en stock.'))+`</div>`+(Object.keys(mm).length?`<h2>Ventes au comptoir par mode</h2><div class="grid">${Object.entries(mm).map(([k,t])=>`<div class="c"><b>${esc(k)}</b><div class="big">${money(t)}</div></div>`).join('')}</div>`:'')+`<h2>Dernières ventes au comptoir</h2>`+(VT.map(x=>`<div class="c"><b>${esc(x.produit)}</b> × ${x.quantite} · ${money(x.montant)} <span class="tg">${esc(x.mode_paiement||'Espèces')}</span> <small>${hr(x.created_at)}</small></div>`).join('')||empty('Aucune vente enregistrée.'))}
function vtot(){const s=$('vp');if(!s||!s.selectedOptions[0])return;const o=s.selectedOptions[0],q=Math.max(1,Math.round(+v('vq'))||1);$('vt').textContent='Total : '+money(q*(+o.dataset.p))}
async function vend(){if(busy)return;const q=Math.round(+v('vq'));if(!(q>=1))return toast('Quantité invalide');busy=true;const{error}=await sb.rpc('vente_comptoir',{p_pharmacie:PHM.id,p_produit:v('vp'),p_quantite:q,p_mode:v('vm')||'Espèces'});busy=false;if(error)return toast(error.message.includes('insuffisant')?'Stock insuffisant':'Vente impossible');toast('Vente enregistrée, stock mis à jour');refresh(true)}

const BANNER=()=>PHM&&!PHM.publie?warn("La fiche de la pharmacie n'est pas encore publiée."):'';
const ROLEOPTS=()=>[['pharmacien','Pharmacien']];
const SPEC_LIST=()=>[];
function ficheV(){const h=PHM;return pdfLink()+`<div class="c"><h2 style="margin-top:0">Photo de la pharmacie</h2><img id="ficheimg" src="${esc(imageSrc(h.image_url))}" alt="Photo de la pharmacie" style="display:block;width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-bottom:8px" onerror="this.onerror=null;this.src=IMG0"><label>Lien public de la photo (facultatif)<input id="fi" type="url" value="${esc(h.image_url||'')}" placeholder="https://…" oninput="previewImage()"></label><small>Si vous n’avez pas encore de photo, l’image illustrative sera affichée. Utilisez une adresse HTTPS publique pour votre vraie photo.</small><h2>1. Identification</h2><label>Nom de la pharmacie<input id="fn" value="${esc(h.nom)}"></label><div class="row"><label>Pharmacien(ne) responsable<input id="fs" value="${esc(h.responsable||'')}"></label><label>N° d'inscription à l'Ordre / autorisation<input id="fa" value="${esc(h.agrement||'')}"></label></div><h3 class="loch">Localisation</h3><label>Adresse / quartier / ville <span class="req">obligatoire</span><input id="fl" value="${esc(h.localisation||'')}"></label><label>Repère<input id="fr" value="${esc(h.repere||'')}"></label>${gpsBlock(h.lat,h.lng)}
<div class="row"><label>Téléphone<input id="ft2" value="${esc(h.telephone||'')}"></label><label>E-mail de la pharmacie<input id="fe" value="${esc(h.email||'')}"></label></div>
<h2>2. Horaires et paiement</h2>${hoursBlock(h)}<label><input type="checkbox" id="fg" ${h.garde?'checked':''} style="width:auto"> Pharmacie de garde</label><small>Paiements acceptés</small>${payBlock(h.paiements_acceptes)}
<h2>3. Assurances et pourcentage pris en charge</h2>${asBlock(h.taux_assurances)}<small>Le détail par produit se règle dans l'onglet Stock.</small>
<h2>4. Validation</h2>`+(h.publie?`<p class="ok">✔ Votre fiche est visible par les patients.</p><button class="b" onclick="saveFiche(true)">Enregistrer les modifications</button>`:`<label><input type="checkbox" id="fc" style="width:auto"> Je certifie que ces informations sont exactes et j'autorise leur affichage aux patients.</label><button class="b" onclick="saveFiche(false)">Publier ma fiche (visible par les patients)</button><button class="b g" onclick="saveFiche(null)">Enregistrer sans publier</button>`)+`</div>`}
async function saveFiche(mode){if(busy)return;const T=asRead();if(mode===false&&!$('fc').checked)return toast('Cochez la case de certification');
if(v('la')!==''&&v('lo')!==''&&(+v('la')<6||+v('la')>11.2||+v('lo')<-0.3||+v('lo')>1.9)&&!confirm('Cette position semble être hors du Togo (latitude entre 6 et 11, longitude entre 0 et 2 attendues). La garder quand même ?'))return;
const photo=v('fi').trim();if(photo&&!/^https:\/\/[^\s]+$/i.test(photo))return toast('La photo doit utiliser une adresse HTTPS publique');const o={nom:v('fn').trim(),image_url:photo||null,responsable:v('fs').trim(),agrement:v('fa').trim(),localisation:v('fl').trim(),repere:v('fr').trim(),lat:v('la')===''?null:+v('la'),lng:v('lo')===''?null:+v('lo'),telephone:v('ft2').trim(),email:v('fe').trim(),...readHours(),garde:$('fg').checked,paiements_acceptes:readPay(),assurances:Object.keys(T),taux_assurances:T};
if(mode===false)o.publie=true;busy=true;const{error}=await sb.from('pharmacies').update(o).eq('id',PHM.id);busy=false;
if(error)return toast(error.message.includes('incompl')?'Fiche incomplète : nom, adresse et position GPS sont obligatoires':'Enregistrement impossible');
PHM={...PHM,...o};toast(mode===false?'Fiche publiée : les patients vous voient':'Fiche enregistrée');render()}

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();</script></body></html>
