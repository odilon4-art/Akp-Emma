return`<select onchange="MS=this.value;$('ml').innerHTML=medListV()"><option value="d" ${MS=='d'?'selected':''}>Trier : plus proche</option><option value="p" ${MS=='p'?'selected':''}>Trier : moins cher</option><option value="n" ${MS=='n'?'selected':''}>Trier : mieux noté</option></select>`+MV.map((x,i)=>`<div class="c"><img class="pimg" src="${prodImg(x.produit)}" alt="${esc(x.produit)}" loading="lazy"><b>${esc(x.pharmacie_nom)}</b> <span class="tg">${x.d.toFixed(1)} km</span><br>${stars(x.note_moyenne,x.nb_avis)}<br>${esc(x.produit)} · <b>${money(x.prix)}</b> <span class="tg ok">En stock</span>${insLine(x,x.prix)}<br><small>Assurances :</small> ${covList(x)}<br><small>📍 ${esc(x.localisation||'')} · ${esc(x.telephone||'')}</small><br><a class="b g" href="${maps(x.lat,x.lng)}" target="_blank" rel="noopener">📍 Itinéraire</a><div class="row"><select id="pm${i}">${payOpts(x,'à la pharmacie')}</select><button class="b" onclick="commander(${i})">Payer / Réserver</button></div></div>`).join('')}
async function commander(i){if(busy)return;const x=MV[i],m=v('pm'+i);let dos={};
if(pat.assurance&&pat.numero_assure&&covers(x,pat.assurance)){dos={numero_assure:v('ai_num').trim(),assure_nom:v('ai_nom').trim(),assure_naissance:v('ai_dn')||null,assure_sexe:v('ai_sx'),code_prescripteur:v('ai_cp').trim(),code_formation:v('ai_cf').trim()};if(!dos.numero_assure||!dos.assure_nom||!dos.assure_naissance||!dos.assure_sexe||!dos.code_prescripteur||!dos.code_formation){window.scrollTo(0,0);return toast("Complétez le dossier d'assurance en haut de la page")}}
busy=true;
const{data,error}=await sb.from('commandes_pharmacie').insert({ligne_id:LIG,patient_id:pat.id,pharmacie_id:x.pharmacie_id,produit:x.produit,montant:x.prix,mode_paiement:m,...dos}).select().single();
if(error){busy=false;return toast('Commande impossible')}
if(m!='Espèces'){const r=await payer('commande',data.id,m);if(r=='redirect')return;if(r=='error'){busy=false;await refresh();render();return toast('Paiement non confirmé : réessayez dans « Pharmacie »'+(LASTERR?' ('+LASTERR+')':''))}}
busy=false;LIG=null;MR=null;await refresh();toast(m=='Espèces'?'Réservé. Payez en espèces à la pharmacie avec votre code.':'Payé. Votre code de retrait est dans « Pharmacie ».');render();window.scrollTo(0,0)}
function cmdV(){return CMD.length?'<h2>Mes commandes</h2>'+CMD.map(c=>{const p=c.pharmacies||{};return`<div class="c"><b>${esc(c.produit)}</b> <span class="tg">${esc(p.nom||'')}</span><br><small>${c.statut=='en_attente_paiement'?'Réservé':paid(c)}</small>`+((c.statut=='paye'||(c.statut=='en_attente_paiement'&&c.mode_paiement=='Espèces'))?`${c.statut!='paye'?`<br><span class="tg">À payer en espèces sur place : <b>${money(c.montant)}</b></span>`:''}<br>Code de retrait <span class="code">${esc(c.code_retrait)}</span><br><small>📍 ${esc(p.localisation||'')}</small><br><a class="b" href="${maps(p.lat,p.lng)}" target="_blank" rel="noopener">Aller à la pharmacie (Google Maps)</a>`:c.statut=='livre'?'<br><span class="tg ok">Délivré</span>'+rateBox('cmd',c.id):`<br><button class="b" onclick="repay('commande',${c.id})">Payer ${money(c.montant)}</button>`)+`</div>`}).join(''):''}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();

</script></body></html>
